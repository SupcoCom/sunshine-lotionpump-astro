name: Deploy to Cloudflare Pages

on:
  push:
    branches: [master]
  workflow_dispatch:
  # WordPress "post published" webhook calls this to trigger a rebuild.
  # Wordpress POSTs to:
  #   POST /repos/{owner}/{repo}/dispatches
  #   body: {"event_type": "wp-content-updated"}
  #   Authorization: Bearer <GH_TOKEN with repo scope>
  repository_dispatch:
    types: [wp-content-updated]
  # Periodic rebuild so WordPress edits go live without a webhook.
  # Runs every 30 min; keep WordPress content fresh on Cloudflare Pages.
  schedule:
    - cron: '*/30 * * * *'

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync content from WordPress + build
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/client --project-name=sunshine-lotionpump
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}